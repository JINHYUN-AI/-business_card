<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#111318">
  <meta name="robots" content="noindex">
  <title>명함 스캐너 | JINHYUN//AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=JetBrains+Mono:wght@500;700&family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" media="print" onload="this.media='all'">
  <script src="../gas-bridge.js"></script>
  <style>
/* JINHYUN//AI 디자인 시스템 (20번 홈페이지와 동일 규격: 먹색 배경 + 라임 포인트 + 각진 모서리 + 모노 라벨) */
:root {
  --bg: #111318; --bg-2: #181a20; --fg: #f4f4f0;
  --fg-60: rgba(244,244,240,.62); --fg-40: rgba(244,244,240,.40);
  --line: rgba(244,244,240,.14); --line-2: rgba(244,244,240,.32);
  --lime: #c3f400; --amber: #f5b97a;
  --f-display: 'Archivo','Noto Sans KR',sans-serif;
  --f-body: 'Noto Sans KR','Helvetica Neue',Arial,sans-serif;
  --f-mono: 'JetBrains Mono','Noto Sans KR',Menlo,Consolas,monospace;
  --ease: cubic-bezier(.2,.8,.2,1);
  color-scheme: dark;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--fg); font-family: var(--f-body); min-height: 100vh; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
h1, h2, h3, h4, p, dl, dd { margin: 0; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
a { color: inherit; text-decoration: none; }
:focus-visible { outline: 2px solid var(--lime); outline-offset: 3px; }

/* ---------- 로딩 화면 ---------- */
#introLoader { --lime: #c3f400; position: fixed; inset: 0; z-index: 99999; background: #111318; display: grid; place-content: center; justify-items: center; gap: 20px; transition: opacity .35s ease; }
.in-logo { font: 900 clamp(34px, 9vw, 64px)/1 'Archivo','Noto Sans KR',sans-serif; letter-spacing: -.03em; color: #f4f4f0; animation: inpulse 1.8s ease-in-out infinite; }
.in-logo i { color: var(--lime); font-style: normal; }
@keyframes inpulse { 0%, 100% { transform: scale(1); text-shadow: 0 0 0 rgba(195,244,0,0); } 50% { transform: scale(1.05); text-shadow: 0 0 26px rgba(195,244,0,.55); } }
.in-sub { font: 500 13px/1.4 'Noto Sans KR','Helvetica Neue',Arial,sans-serif; color: rgba(244,244,240,.62); letter-spacing: -.01em; text-align: center; padding: 0 20px; }
.in-bar { width: min(280px, 70vw); height: 4px; border-radius: 99px; background: rgba(244,244,240,.12); overflow: hidden; }
.in-bar i { display: block; height: 100%; width: 0; border-radius: 99px; background: linear-gradient(90deg, #7fa800, var(--lime)); box-shadow: 0 0 12px rgba(195,244,0,.6); transition: width .2s linear; }
.in-msg { font: 700 11px/1 'JetBrains Mono','Noto Sans KR',Menlo,Consolas,monospace; letter-spacing: .14em; color: rgba(244,244,240,.40); min-height: 11px; }

/* ---------- 배경 장식 ---------- */
.orb { position: fixed; border-radius: 50%; filter: blur(90px); pointer-events: none; z-index: 0; }
.orb.a { width: 70vw; max-width: 520px; aspect-ratio: 1; right: -22%; top: -4%; background: var(--lime); opacity: .14; animation: drift 18s ease-in-out infinite alternate; }
.orb.b { width: 50vw; max-width: 380px; aspect-ratio: 1; left: -16%; bottom: 0; background: var(--fg); opacity: .05; animation: drift 24s ease-in-out infinite alternate-reverse; }
.grain { position: fixed; inset: 0; z-index: 0; pointer-events: none; opacity: .06; mix-blend-mode: overlay;
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>"); }
@keyframes drift { to { transform: translate(-6%, 8%) scale(1.15); } }
#net { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; opacity: .7; }
.lite .orb, .lite .grain, .lite #net { display: none; }

/* ---------- 공통 ---------- */
.page { position: relative; z-index: 1; width: 100%; max-width: 520px; margin: 0 auto; padding: 0 18px 56px; }
.lab { font: 700 11px/1 var(--f-mono); letter-spacing: .14em; text-transform: uppercase; color: var(--fg-60); }
.lime { color: var(--lime); font-style: normal; }
.topbar { display: flex; align-items: center; justify-content: space-between; padding: 16px 0 14px; border-bottom: 1px solid var(--line); }
.logo { font: 900 17px/1 var(--f-display); letter-spacing: -.02em; }
.logo i { color: var(--lime); font-style: normal; }
.tag { display: inline-flex; align-items: center; gap: 8px; }
.dot { width: 7px; height: 7px; background: var(--lime); box-shadow: 0 0 12px var(--lime); animation: pulse 1.8s infinite; }
@keyframes pulse { 50% { opacity: .35; } }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 10px; padding: 15px 18px; font: 800 12px/1 var(--f-mono); letter-spacing: .1em; text-transform: uppercase; border: 1px solid var(--line-2); border-radius: 2px; transition: background .2s, color .2s, border-color .2s; }
.btn:active { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.btn.lime { background: var(--lime); color: #111; border-color: var(--lime); }
.btn.lime:active { background: var(--fg); border-color: var(--fg); }
.btn.block { width: 100%; padding: 18px 18px; font-size: 13px; }
.btn[disabled] { opacity: .5; pointer-events: none; }

.rise { opacity: 0; transform: translateY(26px); transition: opacity .8s var(--ease), transform .8s var(--ease); transition-delay: calc(var(--i, 0) * 90ms); }
.rise.in { opacity: 1; transform: none; }
@media (prefers-reduced-motion: reduce) { .rise { opacity: 1; transform: none; transition: none; } .orb, .in-logo, .dot { animation: none; } }

/* 챕터 띠: [영문 모노 이름] ... [번호] */
.chapter { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 0 0 12px; border-bottom: 1px solid var(--line); margin-top: 44px; }
.ch-name { font: 800 11px/1 var(--f-mono); letter-spacing: .16em; color: var(--fg-40); }
.ch-pos { font: 700 11px/1 var(--f-mono); letter-spacing: .14em; color: var(--fg-40); }
.h2 { font: 900 clamp(28px, 8vw, 40px)/1.08 var(--f-body); letter-spacing: -.05em; word-break: keep-all; margin: 20px 0 10px; text-wrap: balance; }
.body { font-size: 14.5px; line-height: 1.65; color: var(--fg-60); word-break: keep-all; }

/* ---------- 명함 페이지: 히어로 ---------- */
.hero { position: relative; padding: 26px 0 8px; }
.greet { font: 700 15px/1.4 var(--f-body); letter-spacing: -.02em; color: var(--lime); }
.greet b { color: var(--fg); font-weight: 900; }
.hero-grid { display: grid; grid-template-columns: 38% 1fr; gap: 16px; align-items: end; margin-top: 18px; }
.photo { position: relative; aspect-ratio: 4 / 5; background: var(--bg-2); }
.photo img { width: 100%; height: 100%; object-fit: cover; object-position: top center; display: block; filter: saturate(.92) contrast(1.03); }
.photo i { position: absolute; width: 14px; height: 14px; border: 0 solid var(--lime); }
.photo i:nth-child(1) { top: -6px; left: -6px; border-width: 2px 0 0 2px; }
.photo i:nth-child(2) { top: -6px; right: -6px; border-width: 2px 2px 0 0; }
.photo i:nth-child(3) { bottom: -6px; left: -6px; border-width: 0 0 2px 2px; }
.photo i:nth-child(4) { bottom: -6px; right: -6px; border-width: 0 2px 2px 0; }
.photo .hud { position: absolute; left: 6px; bottom: 6px; font: 700 9px/1 var(--f-mono); letter-spacing: .12em; background: rgba(17,19,24,.78); padding: 5px 6px; color: var(--fg); }
.name { font: 900 clamp(46px, 15vw, 72px)/.95 var(--f-body); letter-spacing: -.07em; word-break: keep-all; }
.role { margin-top: 12px; display: grid; gap: 4px; font: 700 13.5px/1.35 var(--f-body); letter-spacing: -.02em; color: var(--fg); }
.role span { color: var(--fg-60); font-weight: 500; }
.slogan { margin-top: 22px; font: 800 clamp(22px, 6.4vw, 30px)/1.25 var(--f-body); letter-spacing: -.05em; word-break: keep-all; min-height: 2.6em; }
.caret { display: inline-block; width: 2px; height: 1em; background: var(--lime); vertical-align: -.12em; margin-left: 3px; animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cta { margin-top: 22px; display: grid; gap: 10px; }
.quick { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.quick .btn { padding: 14px 4px; font-size: 11px; letter-spacing: .08em; }

/* 숫자 */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line); border-bottom: 1px solid var(--line); margin-top: 28px; }
.stat { padding: 18px 0 16px 14px; border-left: 1px solid var(--line); }
.stat:first-child { border-left: 0; padding-left: 0; }
.stat b { display: block; font: 900 clamp(30px, 9vw, 44px)/1 var(--f-display); letter-spacing: -.05em; }
.stat b i { font-style: normal; color: var(--lime); font-size: .55em; margin-left: 2px; letter-spacing: 0; }
.stat > span { display: block; margin-top: 8px; font-size: 11.5px; line-height: 1.35; color: var(--fg-40); word-break: keep-all; }

/* 이력 타임라인 */
.tl { margin-top: 6px; }
.tl-row { display: grid; grid-template-columns: 92px 1fr; gap: 14px; padding: 16px 0; border-bottom: 1px solid var(--line); }
.tl-when { font: 700 11px/1.5 var(--f-mono); letter-spacing: .06em; color: var(--fg-40); }
.tl-when.now { color: var(--lime); }
.tl-what b { display: block; font: 800 14.5px/1.4 var(--f-body); letter-spacing: -.03em; word-break: keep-all; }
.tl-what span { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.45; color: var(--fg-60); word-break: keep-all; }

/* 칩 */
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip { padding: 9px 12px; border: 1px solid var(--line); font: 700 11px/1 var(--f-mono); letter-spacing: .06em; border-radius: 2px; color: var(--fg-60); }
.chip.on { background: var(--lime); color: #111; border-color: var(--lime); }

/* 시스템(에이전트) 목록 */
.agents { margin-top: 6px; }
.agent { display: grid; grid-template-columns: 38px 1fr; gap: 12px; padding: 14px 0; border-bottom: 1px solid var(--line); align-items: start; }
.agent .k { display: grid; place-items: center; width: 34px; height: 34px; border: 1px solid var(--line-2); font: 900 13px/1 var(--f-display); color: var(--lime); }
.agent b { display: block; font: 800 13.5px/1.4 var(--f-body); letter-spacing: -.03em; word-break: keep-all; }
.agent span { display: block; margin-top: 3px; font-size: 12.5px; line-height: 1.45; color: var(--fg-60); word-break: keep-all; }

/* 연락처 줄 */
.rows { margin-top: 8px; }
.row { display: grid; grid-template-columns: 78px 1fr auto; gap: 12px; align-items: center; padding: 16px 0; border-bottom: 1px solid var(--line); }
.row .lab { color: var(--fg-40); }
.row .v { font: 700 15px/1.4 var(--f-body); letter-spacing: -.02em; word-break: break-all; }
.row .go { font: 700 14px/1 var(--f-mono); color: var(--lime); }

.foot { margin-top: 40px; display: grid; gap: 14px; }
.copy { display: flex; justify-content: space-between; margin-top: 8px; }

/* QR 모달 */
.modal-backdrop { display: none; position: fixed; inset: 0; background: rgba(8,9,12,.82); z-index: 1000; align-items: center; justify-content: center; padding: 20px; }
.modal-content { background: var(--bg-2); border: 1px solid var(--line-2); padding: 26px; width: 100%; max-width: 330px; text-align: center; }
.modal-content h4 { font: 900 18px/1.2 var(--f-body); letter-spacing: -.04em; }
.modal-content p { margin-top: 6px; font-size: 12px; color: var(--fg-60); }
.qr-box { background: #fff; padding: 14px; margin: 18px auto; width: max-content; }
.btn-close-modal { width: 100%; }

/* 토스트 */
#toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(120px); background: #111318; border: 1px solid var(--lime); color: var(--fg); padding: 12px 18px; font: 700 12.5px/1.45 var(--f-body); letter-spacing: -.01em; text-align: center; max-width: 92vw; transition: transform .3s var(--ease); z-index: 9999; pointer-events: none; box-shadow: 0 10px 30px rgba(0,0,0,.5); }
#toast.show { transform: translateX(-50%) translateY(0); }

/* ---------- 스캐너 앱 ---------- */
.scan-wrapper { display: flex; flex-direction: column; gap: 18px; padding-top: 6px; }
.scan-header h3 { font: 900 clamp(28px, 8vw, 36px)/1.1 var(--f-body); letter-spacing: -.05em; margin-top: 18px; word-break: keep-all; }
.scan-header h3::after { content: '.'; color: var(--lime); }
.scan-header p { margin-top: 8px; font-size: 13.5px; line-height: 1.6; color: var(--fg-60); word-break: keep-all; }
.camera-dropzone { position: relative; display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 46px 20px; border: 1px dashed var(--line-2); background: rgba(244,244,240,.02); cursor: pointer; text-align: center; transition: border-color .2s, background .2s; }
.camera-dropzone:active { border-color: var(--lime); background: rgba(195,244,0,.05); }
.camera-dropzone::before, .camera-dropzone::after { content: ''; position: absolute; width: 16px; height: 16px; border: 0 solid var(--lime); }
.camera-dropzone::before { top: -1px; left: -1px; border-width: 2px 0 0 2px; }
.camera-dropzone::after { bottom: -1px; right: -1px; border-width: 0 2px 2px 0; }
.camera-icon-circle { display: grid; place-items: center; width: 64px; height: 64px; background: var(--lime); color: #111; font-size: 26px; }
.camera-dropzone span { font: 800 14px/1.3 var(--f-body); letter-spacing: -.03em; }
.camera-dropzone small { font: 700 11px/1.5 var(--f-mono); letter-spacing: .06em; color: var(--fg-40); }
#cardImageInput { display: none; }
#imagePreviewBox { display: none; position: relative; width: 100%; border: 1px solid var(--line-2); background: #000; }
#previewImg { width: 100%; max-height: 260px; object-fit: contain; display: block; }
.btn-reupload { position: absolute; top: 10px; right: 10px; background: rgba(17,19,24,.88); border: 1px solid var(--line-2); padding: 8px 11px; font: 800 11px/1 var(--f-mono); letter-spacing: .08em; }
#ocrLoading { display: none; flex-direction: column; align-items: center; gap: 12px; padding: 26px 10px; border: 1px solid var(--line); position: relative; overflow: hidden; }
#ocrLoading::after { content: ''; position: absolute; left: 0; right: 0; height: 2px; background: var(--lime); box-shadow: 0 0 18px 4px rgba(195,244,0,.5); animation: scanline 1.6s ease-in-out infinite; }
@keyframes scanline { 0% { top: 0; } 50% { top: calc(100% - 2px); } 100% { top: 0; } }
.ocr-spinner { width: 28px; height: 28px; border: 2px solid var(--line-2); border-top-color: var(--lime); border-radius: 50%; animation: spin 1s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
#resultFormBox { display: none; flex-direction: column; gap: 14px; }
#resultFormBox h4 { font: 800 11px/1 var(--f-mono) !important; letter-spacing: .14em; text-transform: uppercase; color: var(--lime) !important; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-group { display: flex; flex-direction: column; gap: 7px; min-width: 0; }
.form-group label { font: 700 10.5px/1 var(--f-mono); letter-spacing: .12em; text-transform: uppercase; color: var(--fg-40); }
.form-group input, .form-group textarea { width: 100%; background: rgba(244,244,240,.04); border: 1px solid var(--line-2); border-radius: 2px; color: var(--fg); padding: 13px 12px; font: 500 15px/1.3 var(--f-body); letter-spacing: -.02em; outline: none; }
.form-group input::placeholder, .form-group textarea::placeholder { color: var(--fg-40); }
.form-group input:focus, .form-group textarea:focus { border-color: var(--lime); background: rgba(195,244,0,.05); }
.action-btn-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 6px; }
.btn-save-device { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 18px; background: var(--lime); color: #111; border: 1px solid var(--lime); border-radius: 2px; font: 800 12.5px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.btn-save-device:active { background: var(--fg); border-color: var(--fg); }
.btn-save-sheet { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 16px; border: 1px solid var(--line-2); border-radius: 2px; font: 800 12px/1.3 var(--f-mono); letter-spacing: .08em; text-transform: uppercase; }
.btn-save-sheet:active { background: var(--fg); color: var(--bg); }
.btn-save-sheet[disabled] { opacity: .5; }

#toast:empty { display: none; }

/* ---------- 자동 촬영 카메라 ---------- */
#camOverlay { position: fixed; inset: 0; z-index: 100000; background: #000; }
#camVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
#camFrame { position: absolute; box-shadow: 0 0 0 100vmax rgba(17,19,24,.66); border: 1px solid rgba(244,244,240,.35); transition: border-color .2s; }
#camFrame.ready { border-color: var(--lime); }
#camFrame i { position: absolute; width: 22px; height: 22px; border: 0 solid var(--lime); }
#camFrame i:nth-child(1) { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
#camFrame i:nth-child(2) { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
#camFrame i:nth-child(3) { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
#camFrame i:nth-child(4) { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
#camFlash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }
#camFlash.go { animation: camflash .25s ease-out; }
@keyframes camflash { 0% { opacity: .85; } 100% { opacity: 0; } }
.cam-top { position: absolute; top: 0; left: 0; right: 0; display: flex; justify-content: space-between; padding: calc(14px + env(safe-area-inset-top, 0px)) 16px 0; }
.cam-btn { padding: 12px 14px; background: rgba(17,19,24,.78); border: 1px solid var(--line-2); border-radius: 2px; font: 800 11.5px/1 var(--f-mono); letter-spacing: .08em; color: var(--fg); min-width: 64px; }
.cam-bottom { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 22px calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 12px; justify-items: center; background: linear-gradient(transparent, rgba(17,19,24,.85) 40%); padding-top: 40px; }
.cam-bar { width: min(280px, 70vw); height: 4px; background: rgba(244,244,240,.18); overflow: hidden; }
.cam-bar i { display: block; height: 100%; width: 0; background: var(--lime); box-shadow: 0 0 12px rgba(195,244,0,.6); transition: width .14s linear; }
.cam-actions { width: 100%; max-width: 360px; display: flex; align-items: center; justify-content: space-between; }
.cam-shutter { width: 68px; height: 68px; border-radius: 50%; background: var(--lime); border: 4px solid #111318; box-shadow: 0 0 0 3px var(--lime); }
.cam-shutter:active { transform: scale(.94); }

/* 히어로: 이름·소속은 오른쪽 정렬 */
.who { text-align: right; }
.role { justify-items: end; }
.role b span { color: var(--fg); font-weight: 800; }
.cta { margin-top: 22px; }
/* 한 줄 제목 */
.h2.one { font-size: clamp(21px, 6.4vw, 30px); white-space: nowrap; letter-spacing: -.05em; }

/* ---------- 이력(20번 홈페이지와 동일 구조) ---------- */
.stats.k4 { grid-template-columns: repeat(4, 1fr); }
.stats.k4 .stat { padding: 16px 0 14px 10px; }
.stats.k4 .stat b { font-size: clamp(24px, 7.4vw, 36px); }
.stats.k4 .stat > span { font-size: 10.5px; margin-top: 6px; }
#pfTabs { display: grid; grid-template-columns: repeat(var(--n, 5), 1fr); gap: 4px; margin: 14px 0 12px; }
#pfTabs .chip { padding: 11px 2px; font-size: 10.5px; letter-spacing: 0; white-space: nowrap; text-align: center; cursor: pointer; }
.pf-r { border: 1px solid var(--line); background: linear-gradient(160deg, rgba(244,244,240,.06), rgba(244,244,240,.015)); border-radius: 2px; overflow: hidden; }
.mchart { display: flex; align-items: flex-end; gap: 3px; height: 92px; padding: 24px 14px 0; border-bottom: 1px solid var(--line); position: relative; }
.mchart[hidden] { display: none; }
.mchart i { flex: 1; min-width: 2px; background: var(--line-2); height: calc(var(--h) * 1%); transform: scaleY(0); transform-origin: bottom; }
.mchart i.on { background: var(--lime); }
.mchart.go i { animation: barUp .85s cubic-bezier(.16,1,.3,1) both; animation-delay: calc(var(--k) * 32ms + .1s); }
@keyframes barUp { 0% { transform: scaleY(0); opacity: .2; } 60% { opacity: 1; } 100% { transform: scaleY(1); opacity: 1; } }
.mchart .cap { position: absolute; left: 14px; top: 8px; font: 700 9.5px/1 var(--f-mono); letter-spacing: .08em; color: var(--fg-40); }

<body>
  <div id="introLoader" aria-hidden="true">
    <div class="in-logo">JINHYUN<i>//</i>AI</div>
    <div class="in-sub">AI 명함 스캐너 &amp; 인맥 관리</div>
    <div class="in-bar"><i id="loaderBar"></i></div>
    <div class="in-msg" id="loaderMsg">환경 구성 중</div>
  </div>
  <div id="toast"></div>
  <!-- 자동 촬영 카메라 -->
  <div id="camOverlay" style="display:none">
    <video id="camVideo" playsinline muted autoplay></video>
    <div id="camFrame"><i></i><i></i><i></i><i></i></div>
    <div id="camFlash"></div>
    <div class="cam-top">
      <button class="cam-btn" type="button" onclick="stopCamera()">✕ 닫기</button>
      <button class="cam-btn" type="button" onclick="toggleCamOrientation()">↻ 가로/세로</button>
    </div>
    <div class="cam-bottom">
      <div class="lab" id="camMsg" style="color:var(--fg)">명함을 틀에 맞춰주세요</div>
      <div class="cam-bar"><i id="camProg"></i></div>
      <div class="cam-actions">
        <button class="cam-btn" type="button" onclick="pickFromAlbum()">앨범</button>
        <button class="cam-shutter" type="button" onclick="captureFromCamera(false)" aria-label="촬영"></button>
        <span style="width:64px"></span>
      </div>
    </div>
  </div>
  <input type="file" id="albumInput" accept="image/*" style="display:none" onchange="handleImageSelected(event)">

  <div class="orb a"></div><div class="orb b"></div><div class="grain"></div>

  <main class="page">
    <header class="topbar">
      <span class="logo">JINHYUN<i>//</i>AI</span>
      <span class="lab tag"><span class="dot"></span>CARD SCANNER</span>
    </header>

    <div id="viewScanner" class="scan-wrapper" style="display: flex;">
      <div class="chapter" style="margin-top: 28px;"><span class="ch-name">SCAN</span><span class="ch-pos">01 촬영 · 02 확인 · 03 보내기</span></div>
      <div class="scan-header" style="margin-top: -4px;">
        <h3>명함을 찍으세요</h3>
        <p>AI가 이름·직함·연락처를 읽어 내 폰 연락처와 시트에 저장하고, 내 명함을 바로 보낼 수 있습니다.</p>
      </div>

      <div class="camera-dropzone" id="cameraDropzone" onclick="triggerCamera()">
        <div class="camera-icon-circle"><i class="fa-solid fa-camera"></i></div>
        <span>명함 촬영 또는 사진 선택</span>

      </div>

      <div id="imagePreviewBox">

        <button class="btn-reupload" onclick="triggerCamera()"><i class="fa-solid fa-rotate-right"></i> 다시 촬영</button>
      </div>

      <div id="ocrLoading">
        <div class="ocr-spinner"></div>
        <div class="lab" style="color: var(--lime);">AI가 명함을 분석 중입니다</div>
        <div class="lab" style="color: var(--fg-40);">약 1~2초</div>
      </div>

      <div id="resultFormBox">
        <div class="chapter" style="margin-top: 6px;"><span class="ch-name" style="color: var(--lime);">RESULT · 인식 결과</span><span class="ch-pos">수정 가능</span></div>

        <div class="form-row">
          <div class="form-group"><label>성명 *</label><input type="text" id="scanName" placeholder="홍길동"></div>
          <div class="form-group"><label>직책/직함</label><input type="text" id="scanTitle" placeholder="대표이사 / 부장"></div>

          <div class="form-group"><label>회사/기관명</label><input type="text" id="scanOrg" placeholder="(주)한국복지"></div>
          <div class="form-group"><label>부서</label><input type="text" id="scanDept" placeholder="기획팀"></div>
        </div>

        </div>

        <div class="action-btn-group">
          <button class="btn-save-device" onclick="saveScannedCardToPhone()"><i class="fa-solid fa-mobile-screen-button"></i> 내 폰에 저장</button>

  <script>
    // 전역 상태
    let myProfile = {};
    let currentScannedData = null;
    let selectedImageBase64 = null;

    // ========================================================
    // 초기 부팅 및 로더 라이프사이클
    // ========================================================
    window.addEventListener('DOMContentLoaded', () => {
      startLoader();
      loadProfileData();
    });

    const LOADER_MSG = ['환경 구성 중', '데이터 불러오는 중', '화면 구성 중'];
    let loaderProg = 0;
    let loaderDone = false;
    const loaderT0 = Date.now();

    function setLoaderProg(p) {
      loaderProg = Math.max(loaderProg, Math.min(100, p));
      const bar = document.getElementById('loaderBar');
      const msg = document.getElementById('loaderMsg');
      if (bar) bar.style.width = loaderProg + '%';
      if (msg) msg.textContent = LOADER_MSG[loaderProg < 40 ? 0 : loaderProg < 90 ? 1 : 2];
    }

    function startLoader() {
      window._loaderInterval = setInterval(() => {
        const e = Date.now() - loaderT0;
        setLoaderProg(88 * (1 - Math.exp(-e / 1500)));
      }, 60);
      setTimeout(completeLoader, 6000); // 서버가 느려도 6초 뒤에는 화면을 연다
    }

    function completeLoader() {
      if (loaderDone) return;
      loaderDone = true;
      clearInterval(window._loaderInterval);
      const loader = document.getElementById('introLoader');
      setLoaderProg(100);
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => { loader.style.display = 'none'; }, 350);
      }, 200);
    }

    // ========================================================
    // 프로필 데이터 로드
    // ========================================================
    // 재방문 시에는 저장해 둔 프로필을 즉시 보여주고, 서버 값은 뒤에서 갱신한다
    function loadProfileData() {
      // 스캐너 앱은 프로필 없이도 쓸 수 있으므로 서버 응답을 기다리지 않고 바로 화면을 연다
      google.script.run
        .withSuccessHandler((res) => { if (res && res.success && res.profile) myProfile = res.profile; })
        .withFailureHandler((err) => console.error(err))
        .getProfileData();
      setTimeout(completeLoader, 400);
    }

    // ========================================================
    // vCard (.vcf) 생성 및 스마트폰 연락처 바로 저장
    // ========================================================
    function vcEsc(v) {
      return String(v || '')
        .replace(/\\/g, '\\\\')
        .replace(/\r?\n/g, '\\n')
        .replace(/,/g, '\\,')
        .replace(/;/g, '\\;');
    }

    function generateVCardString(data) {
      const full = String(data.name || '').trim();
      // 한글 이름은 첫 글자를 성, 나머지를 이름으로 나눠 연락처 앱에서 자연스럽게 보이게 함
      let family = '', given = full;
      if (/^[가-힣]{2,4}$/.test(full)) { family = full.charAt(0); given = full.slice(1); }
      const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
      lines.push('N:' + vcEsc(family) + ';' + vcEsc(given) + ';;;');
      lines.push('FN:' + vcEsc(full));
      if (data.organization || data.department) lines.push('ORG:' + vcEsc(data.organization) + (data.department ? ';' + vcEsc(data.department) : ''));
      if (data.title) lines.push('TITLE:' + vcEsc(data.title));
      if (data.mobile) lines.push('TEL;TYPE=CELL:' + vcEsc(data.mobile));
      if (data.tel) lines.push('TEL;TYPE=WORK,VOICE:' + vcEsc(data.tel));
      if (data.email) lines.push('EMAIL;TYPE=INTERNET:' + vcEsc(data.email));
      if (data.address) lines.push('ADR;TYPE=WORK:;;' + vcEsc(data.address) + ';;;;');
      if (data.website) lines.push('URL:' + vcEsc(data.website));
      if (data.memo) lines.push('NOTE:' + vcEsc(data.memo));
      lines.push('END:VCARD');
      return lines.join('\r\n') + '\r\n';
    }

    function triggerVCardDownload(vcardContent, filename) {
      const blob = new Blob([vcardContent], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // 안드로이드: 연락처 '새로 만들기' 화면을 값이 채워진 채로 직접 열기 (파일 형식 문제 없음)
    // 그 외(아이폰/PC 등)나 열리지 않는 환경: vCard(.vcf) 파일 내려받기
    function saveContact(data, vcard, filename, auto) {
      if (auto) { triggerVCardDownload(vcard, filename); return; }
      if (/Android/i.test(navigator.userAgent)) {
        const parts = [
          'S.name=' + encodeURIComponent(data.name || ''),
          'S.phone=' + encodeURIComponent(data.mobile || ''),
          'S.secondary_phone=' + encodeURIComponent(data.tel || ''),
          'S.email=' + encodeURIComponent(data.email || ''),
          'S.company=' + encodeURIComponent(data.organization || ''),
          'S.job_title=' + encodeURIComponent(data.title || ''),
          'S.postal=' + encodeURIComponent(data.address || ''),
          'S.notes=' + encodeURIComponent([data.department, data.website, data.memo].filter(Boolean).join(' / '))
        ];
        let left = false;
        const onHide = () => { if (document.hidden) left = true; };
        document.addEventListener('visibilitychange', onHide);
        window.location.href = 'intent:#Intent;action=android.intent.action.INSERT;type=vnd.android.cursor.dir/contact;' + parts.join(';') + ';end';
        setTimeout(() => {
          document.removeEventListener('visibilitychange', onHide);
          if (!left && !auto) triggerVCardDownload(vcard, filename); // 연락처 앱이 안 열렸으면 파일로 대체
        }, 1500);
        return;
      }
      triggerVCardDownload(vcard, filename);
    }

    // ========================================================
    // 카메라 촬영 및 Gemini AI OCR 스캔
    // ========================================================
    // 사진 한 장(dataURL)을 받아 미리보기 표시 후 AI OCR 시작
    function processImageDataUrl(dataUrl, mimeType) {
      selectedImageBase64 = dataUrl;
      document.getElementById('previewImg').src = dataUrl;
      document.getElementById('imagePreviewBox').style.display = 'block';
      document.getElementById('cameraDropzone').style.display = 'none';
      runGeminiOcr(dataUrl, mimeType || 'image/jpeg');
    }

    // 앨범/기본 카메라 앱에서 고른 사진
    function handleImageSelected(event) {
      const file = event.target.files[0];
      event.target.value = '';
      if (!file) return;
      const reader = new FileReader();
      reader.onload = (e) => processImageDataUrl(e.target.result, file.type);
      reader.readAsDataURL(file);
    }

    function pickFromAlbum() {
      stopCamera();
      document.getElementById('albumInput').click();
    }

    // ========================================================
    // 자동 촬영 카메라: 틀 안에 명함이 선명하게 들어와 가만히 있으면 자동으로 찍는다
    // ========================================================
    const CARD_RATIO = 85.6 / 54;   // 명함 가로:세로
    const HOLD_MS = 1000;           // 이 시간 동안 조건이 유지되면 촬영
    const GRACE_MS = 350;           // 잠깐 흔들려도 봐주는 시간
    const MIN_SHARP = 28;           // 선명도(라플라시안 분산) 최소값
    const MIN_EDGE = 0.035;         // 틀 안에 글자/선이 있어야 하는 최소 비율
    const MAX_EDGE = 0.55;          // 너무 어지러운 배경 제외
    const MAX_MOTION = 5.5;         // 직전 화면과의 평균 밝기 차이(작을수록 정지)
    const cam = { stream: null, timer: 0, portrait: false, okSince: 0, lastOk: 0, prev: null, best: 0, busy: false };
    const camCv = document.createElement('canvas');
    camCv.width = 160; camCv.height = 100;
    const camCtx = camCv.getContext('2d', { willReadFrequently: true });

    function triggerCamera() {
      const md = navigator.mediaDevices;
      if (!md || !md.getUserMedia || !window.isSecureContext) { document.getElementById('cardImageInput').click(); return; }
      openCamera();
    }

    async function openCamera() {
      const ov = document.getElementById('camOverlay');
      const video = document.getElementById('camVideo');
      try {
        cam.stream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: { ideal: 'environment' }, width: { ideal: 1920 }, height: { ideal: 1080 } },
          audio: false
        });
      } catch (e) {
        showToast('카메라를 열 수 없어 기본 카메라 앱으로 전환합니다.');
        document.getElementById('cardImageInput').click();
        return;
      }
      video.srcObject = cam.stream;
      ov.style.display = 'block';
      document.body.style.overflow = 'hidden';
      cam.okSince = 0; cam.lastOk = 0; cam.prev = null; cam.best = 0; cam.busy = false;
      layoutGuide();
      await video.play().catch(() => {});
      setCamStatus('명함을 틀에 맞춰주세요', 0);
      cam.timer = setInterval(analyzeFrame, 140);
    }

    function stopCamera() {
      clearInterval(cam.timer); cam.timer = 0;
      if (cam.stream) { cam.stream.getTracks().forEach((t) => t.stop()); cam.stream = null; }
      const video = document.getElementById('camVideo');
      video.srcObject = null;
      document.getElementById('camOverlay').style.display = 'none';
      document.body.style.overflow = '';
    }

    function toggleCamOrientation() {
      cam.portrait = !cam.portrait;
      cam.okSince = 0; cam.prev = null;
      layoutGuide();
    }

    // 틀(화면 좌표) 계산 및 배치
    function guideRect() {
      const W = window.innerWidth, H = window.innerHeight;
      let w, h;
      if (!cam.portrait) { w = Math.min(W * 0.9, 560); h = w / CARD_RATIO; }
      else { h = Math.min(H * 0.62, 560); w = h / CARD_RATIO; }
      return { x: (W - w) / 2, y: (H - h) / 2 - H * 0.04, w, h };
    }

    function layoutGuide() {
      const g = guideRect();
      const f = document.getElementById('camFrame');
      f.style.left = g.x + 'px'; f.style.top = g.y + 'px'; f.style.width = g.w + 'px'; f.style.height = g.h + 'px';
    }
    window.addEventListener('resize', () => { if (cam.stream) layoutGuide(); });

    // 틀을 영상 픽셀 좌표로 변환 (영상은 화면에 cover 방식으로 채워져 있음)
    function guideInVideo(margin) {
      const video = document.getElementById('camVideo');
      const vw = video.videoWidth, vh = video.videoHeight;
      if (!vw || !vh) return null;
      const W = window.innerWidth, H = window.innerHeight;
      const scale = Math.max(W / vw, H / vh);
      const offX = (W - vw * scale) / 2, offY = (H - vh * scale) / 2;
      const g = guideRect();
      const mx = g.w * margin, my = g.h * margin;
      const x = Math.max(0, (g.x - mx - offX) / scale);
      const y = Math.max(0, (g.y - my - offY) / scale);
      const w = Math.min(vw - x, (g.w + 2 * mx) / scale);
      const h = Math.min(vh - y, (g.h + 2 * my) / scale);
      return { x, y, w, h, vw, vh };
    }

    // 틀 안 화면을 작게 뜯어 선명도·글자량·정지 여부를 계산
    function analyzeFrame() {
      if (cam.busy) return;
      const video = document.getElementById('camVideo');
      const r = guideInVideo(0);
      if (!r || video.readyState < 2) return;
      camCtx.drawImage(video, r.x, r.y, r.w, r.h, 0, 0, camCv.width, camCv.height);
      const W = camCv.width, H = camCv.height;
      const data = camCtx.getImageData(0, 0, W, H).data;
      const gray = new Float32Array(W * H);
      for (let i = 0, p = 0; i < data.length; i += 4, p++) gray[p] = data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114;

      // 라플라시안 분산(선명도) + 가장자리 비율(글자·선 존재)
      let sum = 0, sum2 = 0, n = 0, edges = 0;
      for (let y = 1; y < H - 1; y++) {
        for (let x = 1; x < W - 1; x++) {
          const i = y * W + x;
          const lap = 4 * gray[i] - gray[i - 1] - gray[i + 1] - gray[i - W] - gray[i + W];
          sum += lap; sum2 += lap * lap; n++;
          const gx = gray[i + 1] - gray[i - 1], gy = gray[i + W] - gray[i - W];
          if (Math.abs(gx) + Math.abs(gy) > 60) edges++;
        }
      }
      const sharp = sum2 / n - (sum / n) * (sum / n);
      const edgeRatio = edges / n;

      // 직전 화면과의 차이(정지 여부)
      let motion = 99;
      if (cam.prev) {
        let d = 0;
        for (let i = 0; i < gray.length; i += 3) d += Math.abs(gray[i] - cam.prev[i]);
        motion = d / (gray.length / 3);
      }
      cam.prev = gray;

      cam.best = Math.max(sharp, cam.best * 0.97);
      const sharpOk = sharp >= MIN_SHARP && sharp >= cam.best * 0.65;
      const edgeOk = edgeRatio >= MIN_EDGE && edgeRatio <= MAX_EDGE;
      const steady = motion <= MAX_MOTION;
      const now = performance.now();

      if (sharpOk && edgeOk && steady) {
        cam.lastOk = now;
        if (!cam.okSince) cam.okSince = now;
        const p = Math.min(1, (now - cam.okSince) / HOLD_MS);
        setCamStatus('그대로 유지하세요', p);
        if (p >= 1) captureFromCamera(true);
      } else if (cam.okSince && now - cam.lastOk < GRACE_MS) {
        // 잠깐의 흔들림은 유지
      } else {
        cam.okSince = 0;
        setCamStatus(!edgeOk ? '명함을 틀 안에 가득 채워주세요' : !steady ? '폰을 고정해 주세요' : '초점을 맞추는 중…', 0);
      }
    }

    function setCamStatus(msg, p) {
      document.getElementById('camMsg').textContent = msg;
      document.getElementById('camProg').style.width = Math.round(p * 100) + '%';
      document.getElementById('camFrame').classList.toggle('ready', p > 0);
    }

    // 촬영: 틀(+4% 여유) 안쪽만 잘라 JPEG로 만든 뒤 OCR에 전달
    function captureFromCamera(auto) {
      if (cam.busy) return;
      const video = document.getElementById('camVideo');
      const r = guideInVideo(0.04);
      if (!r) return;
      cam.busy = true;
      const cv = document.createElement('canvas');
      cv.width = Math.round(r.w); cv.height = Math.round(r.h);
      cv.getContext('2d').drawImage(video, r.x, r.y, r.w, r.h, 0, 0, cv.width, cv.height);
      const dataUrl = cv.toDataURL('image/jpeg', 0.92);
      if (navigator.vibrate) navigator.vibrate(60);
      const flash = document.getElementById('camFlash');
      flash.classList.add('go');
      setTimeout(() => flash.classList.remove('go'), 250);
      stopCamera();
      processImageDataUrl(dataUrl, 'image/jpeg');
      if (auto) showToast('📸 자동으로 촬영했습니다');
    }

    function runGeminiOcr(base64Data, mimeType) {
      const loading = document.getElementById('ocrLoading');
      const formBox = document.getElementById('resultFormBox');
      
      loading.style.display = 'flex';
      formBox.style.display = 'none';

      google.script.run
        .withSuccessHandler((res) => {
          loading.style.display = 'none';
          if (res && res.success && res.data) {
            currentScannedData = res.data;
            fillScannedForm(res.data);
            formBox.style.display = 'flex';
            showToast('✨ AI 명함 분석이 완료되었습니다!');
          } else {
            showToast('⚠️ 인식 실패: ' + (res.error || '정보를 읽지 못했습니다.'));
            formBox.style.display = 'flex'; // 빈 폼이라도 직접 입력할 수 있도록 표출
          }
        })
        .withFailureHandler((err) => {
          loading.style.display = 'none';
          showToast('❌ 오류 발생: ' + err.message);
          formBox.style.display = 'flex';
        })
        .scanBusinessCardWithGemini(base64Data, mimeType);
    }

    function fillScannedForm(d) {
      document.getElementById('scanName').value = d.name || '';
      document.getElementById('scanTitle').value = d.title || '';
      document.getElementById('scanOrg').value = d.organization || '';
      document.getElementById('scanDept').value = d.department || '';
      document.getElementById('scanMobile').value = d.mobile || '';
      document.getElementById('scanTel').value = d.tel || '';
      document.getElementById('scanEmail').value = d.email || '';
      document.getElementById('scanAddress').value = d.address || '';
      document.getElementById('scanWebsite').value = d.website || '';
      document.getElementById('scanMemo').value = d.memo || '';
      prefetchMyCardGif();
    }

    function getFormData() {
      return {
        name: document.getElementById('scanName').value.trim(),
        title: document.getElementById('scanTitle').value.trim(),
        organization: document.getElementById('scanOrg').value.trim(),
        department: document.getElementById('scanDept').value.trim(),
        mobile: document.getElementById('scanMobile').value.trim(),
        tel: document.getElementById('scanTel').value.trim(),
        email: document.getElementById('scanEmail').value.trim(),
        address: document.getElementById('scanAddress').value.trim(),
        website: document.getElementById('scanWebsite').value.trim(),
        memo: document.getElementById('scanMemo').value.trim()
      };
    }

    // 1. 상대방 연락처를 내 폰 주소록에 바로 저장
    function saveScannedCardToPhone() {
      const data = getFormData();
      if (!data.name && !data.mobile) {
        showToast('성명 또는 전화번호를 입력해주세요.');
        return;
      }

      const vcData = Object.assign({}, data, { name: [data.name, data.title].filter(Boolean).join(' ') });
      const vcard = generateVCardString(vcData);
      const filename = `${vcData.name || '명함'}_연락처.vcf`;
      saveContact(vcData, vcard, filename);
      showToast('📲 내 폰 연락처 앱이 열립니다. [저장]을 누르세요!');

      // 백그라운드로 시트 저장도 함께 트리거
      data.isSaved = true;
      google.script.run.saveScannedCard(data);
    }

    // 3. 내 명함 보내기 (안드로이드 공유창: GIF + 연락처(.vcf) + 문구)
    const CARD_PAGE_URL = 'https://card.jinhyun.ai.kr/s';
    const HOMEPAGE_URL = 'https://jinhyun.ai.kr';
    const MY_PHONE = '010-4790-1011';
    let myCardGifFile = null;
    let myCardGifLoading = false;

    function prefetchMyCardGif() {
      if (myCardGifFile || myCardGifLoading) return;
      myCardGifLoading = true;
      fetch('../card.gif')
        .then((r) => { if (!r.ok) throw new Error('GIF ' + r.status); return r.blob(); })
        .then((blob) => { myCardGifFile = new File([blob], '전자명함_장진현.gif', { type: 'image/gif' }); })
        .catch((e) => console.warn(e))
        .finally(() => { myCardGifLoading = false; });
    }

    function buildMyVcardFile() {
      const p = myProfile || {};
      const vcard = generateVCardString({
        name: [p.name || '장진현', p.title || '사무국장'].filter(Boolean).join(' '),
        organization: p.organization || '등대의집',
        department: '',
        title: p.title || '사무국장',
        mobile: p.mobile || MY_PHONE,
        tel: p.tel || '041-582-4495',
        email: p.email || '2016235@light4u.kr',
        address: p.address || '충청남도 천안시 서북구 직산읍 성진로410-11',
        website: p.website || HOMEPAGE_URL,
        memo: ''
      });
      return new File([vcard], '장진현_연락처.vcf', { type: 'text/vcard' });
    }

    async function sendMyCard() {
      const d = getFormData();
      const phone = (myProfile && myProfile.mobile) || MY_PHONE;
      const callName = d.name ? d.name + (d.title ? ' ' + d.title : '') + '님' : '';
      const text = '안녕하세요? ' + callName + (callName ? ', ' : '') + '장진현입니다.\n제 전자명함입니다.\n\n장진현 ' + phone + '\n\n▶ 아래 링크를 누르면 제 연락처가 바로 저장됩니다.\n' + CARD_PAGE_URL;

      if (!myCardGifFile) {
        prefetchMyCardGif();
        showToast('명함 파일을 준비 중입니다. 잠시 후 다시 눌러주세요.');
        return;
      }
      const candidates = [[myCardGifFile, buildMyVcardFile()], [myCardGifFile]];
      for (const files of candidates) {
        try {
          if (navigator.canShare && navigator.canShare({ files })) {
            await navigator.share({ files, text });
            recordShare();
            return;
          }
        } catch (e) {
          if (e && e.name === 'AbortError') return;
        }
      }
      // 파일 공유가 안 되는 환경: 문자앱에 문구만 채워 열기
      const num = (d.mobile || '').replace(/[^0-9+]/g, '');
      window.location.href = 'sms:' + num + '?body=' + encodeURIComponent(text);
      recordShare();
    }

    function recordShare() {
      google.script.run.recordVisit('SEND_MY_CARD', navigator.userAgent, true);
    }

    // ========================================================
    // 토스트 알림
    // ========================================================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  
  </script>
</body>
