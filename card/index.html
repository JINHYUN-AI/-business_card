<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>장진현 | 전자명함</title>
  
  <!-- 웹 폰트 (Outfit & Pretendard) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css" />
  
  <!-- FontAwesome 아이콘 -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <!-- QRCode.js 라이브러리 -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script src="../gas-bridge.js"></script>

  <style>
    :root {
      --bg-dark: #0B0F19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #3B82F6;
      --primary-glow: rgba(59, 130, 246, 0.35);
      --accent: #38BDF8;
      --accent-glow: rgba(56, 189, 248, 0.3);
      --success: #10B981;
      --text-main: #F8FAFC;
      --text-sub: #94A3B8;
      --text-muted: #64748B;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: "Pretendard Variable", -apple-system, BlinkMacSystemFont, system-ui, Roboto, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(at 0% 0%, rgba(30, 58, 138, 0.25) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(15, 118, 110, 0.2) 0px, transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 40px;
      overflow-x: hidden;
    }

    /* ========================================================
       7장 기관용 표준 인트로 로딩 화면
       ======================================================== */
    #introLoader {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0B0F19;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.35s ease-out;
    }

    .loader-ci {
      width: 74px;
      height: 74px;
      border-radius: 50%;
      object-fit: cover;
      animation: pulse-glow 1.8s infinite ease-in-out;
      box-shadow: 0 0 25px rgba(56, 189, 248, 0.4);
      margin-bottom: 24px;
      background: #1E293B;
      padding: 4px;
      border: 2px solid rgba(56, 189, 248, 0.6);
    }

    @keyframes pulse-glow {
      0%, 100% {
        transform: scale(1);
        box-shadow: 0 0 20px rgba(56, 189, 248, 0.3);
      }
      50% {
        transform: scale(1.05);
        box-shadow: 0 0 35px rgba(56, 189, 248, 0.6);
      }
    }

    .loader-title {
      font-family: 'Outfit', sans-serif;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 0%, #38BDF8 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .loader-sub {
      font-size: 13px;
      color: var(--text-sub);
      margin-bottom: 30px;
    }

    .loader-progress-track {
      width: 280px;
      height: 4px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 14px;
    }

    .loader-progress-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #3B82F6, #38BDF8);
      border-radius: 999px;
      transition: width 0.3s ease;
    }

    .loader-status-msg {
      font-size: 12px;
      color: var(--text-muted);
      height: 16px;
    }

    /* ========================================================
       메인 래퍼 및 헤더
       ======================================================== */
    .app-container {
      width: 100%;
      max-width: 440px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* 상단 세그먼트 탭 */
    .tab-switch {
      display: flex;
      background: rgba(15, 23, 42, 0.8);
      backdrop-filter: blur(12px);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 4px;
      position: sticky;
      top: 12px;
      z-index: 100;
    }

    .tab-btn {
      flex: 1;
      padding: 12px 14px;
      border: none;
      background: transparent;
      color: var(--text-sub);
      font-size: 14px;
      font-weight: 600;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: all 0.25s ease;
    }

    .tab-btn.active {
      background: linear-gradient(135deg, #1E3A8A 0%, #2563EB 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4);
    }

    /* ========================================================
       [모드 1] 내 디지털 전자명함 (NFC / QR 화면)
       ======================================================== */
    .card-wrapper {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      overflow: hidden;
    }

    .card-wrapper::before {
      content: '';
      position: absolute;
      top: -60px;
      right: -60px;
      width: 140px;
      height: 140px;
      background: radial-gradient(circle, var(--accent-glow) 0%, transparent 70%);
      pointer-events: none;
    }

    .nfc-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(56, 189, 248, 0.12);
      border: 1px solid rgba(56, 189, 248, 0.25);
      color: var(--accent);
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      margin-bottom: 20px;
      font-family: 'Outfit', sans-serif;
    }

    .profile-avatar-box {
      position: relative;
      width: 104px;
      height: 104px;
      margin-bottom: 18px;
    }

    .profile-avatar {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 3px solid rgba(255, 255, 255, 0.15);
      background: #1E293B;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.35);
    }

    .profile-avatar-glow {
      position: absolute;
      inset: -4px;
      border-radius: 50%;
      background: linear-gradient(135deg, #38BDF8, #3B82F6, #10B981);
      z-index: -1;
      opacity: 0.6;
      filter: blur(6px);
    }

    .name-title-box {
      margin-bottom: 12px;
    }

    .person-name {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: -0.5px;
      color: #FFFFFF;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .person-title {
      font-size: 14px;
      font-weight: 600;
      color: var(--accent);
      margin-top: 4px;
    }

    .person-org {
      font-size: 13px;
      color: var(--text-sub);
      margin-top: 2px;
    }

    .person-intro {
      font-size: 14px;
      color: #CBD5E1;
      background: rgba(15, 23, 42, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.05);
      padding: 12px 18px;
      border-radius: 14px;
      line-height: 1.5;
      margin: 14px 0 22px;
      width: 100%;
      word-break: keep-all;
    }

    /* 대형 연락처 저장 버튼 */
    .btn-save-contact {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #2563EB 0%, #1D4ED8 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 16px;
      font-size: 16px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
      box-shadow: 0 10px 24px rgba(37, 99, 235, 0.4);
      transition: all 0.2s ease;
      margin-bottom: 16px;
    }

    .btn-save-contact:active {
      transform: scale(0.98);
      box-shadow: 0 4px 12px rgba(37, 99, 235, 0.3);
    }

    /* 퀵 인터랙션 버튼 그리드 (전화, 문자, 메일, QR) */
    .quick-actions-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      width: 100%;
      margin-bottom: 24px;
    }

    .quick-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid var(--card-border);
      color: var(--text-sub);
      padding: 12px 6px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 11px;
      font-weight: 600;
      transition: all 0.2s ease;
    }

    .quick-btn i {
      font-size: 18px;
      color: var(--accent);
    }

    .quick-btn:active {
      background: rgba(56, 189, 248, 0.15);
      color: #FFFFFF;
      border-color: rgba(56, 189, 248, 0.3);
    }

    /* 상세 연락처 리스트 */
    .contact-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
      text-align: left;
    }

    .contact-item {
      display: flex;
      align-items: center;
      gap: 12px;
      background: rgba(15, 23, 42, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.04);
      padding: 12px 14px;
      border-radius: 12px;
      text-decoration: none;
      color: var(--text-main);
    }

    .contact-item-icon {
      width: 34px;
      height: 34px;
      border-radius: 10px;
      background: rgba(59, 130, 246, 0.15);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--accent);
      font-size: 14px;
      flex-shrink: 0;
    }

    .contact-item-content {
      flex: 1;
      overflow: hidden;
    }

    .contact-item-label {
      font-size: 11px;
      color: var(--text-muted);
      margin-bottom: 2px;
    }

    .contact-item-val {
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #E2E8F0;
    }

    /* ========================================================
       [모드 2] 상대방 명함 스캐너 (AI OCR 모드)
       ======================================================== */
    .scan-wrapper {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      display: flex;
      flex-direction: column;
      gap: 18px;
    }

    .scan-header {
      text-align: center;
    }

    .scan-header h3 {
      font-size: 20px;
      font-weight: 800;
      color: #FFFFFF;
      margin-bottom: 6px;
    }

    .scan-header p {
      font-size: 13px;
      color: var(--text-sub);
    }

    /* 카메라 촬영 드롭존 */
    .camera-dropzone {
      position: relative;
      border: 2px dashed rgba(56, 189, 248, 0.4);
      background: rgba(15, 23, 42, 0.6);
      border-radius: 20px;
      padding: 32px 16px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      cursor: pointer;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .camera-dropzone:active {
      border-color: var(--accent);
      background: rgba(56, 189, 248, 0.08);
    }

    .camera-icon-circle {
      width: 64px;
      height: 64px;
      border-radius: 50%;
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.2) 0%, rgba(56, 189, 248, 0.2) 100%);
      border: 1px solid rgba(56, 189, 248, 0.3);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: var(--accent);
    }

    .camera-dropzone span {
      font-size: 14px;
      font-weight: 600;
      color: #F1F5F9;
    }

    .camera-dropzone small {
      font-size: 12px;
      color: var(--text-muted);
    }

    #cardImageInput {
      display: none;
    }

    /* 이미지 미리보기 */
    #imagePreviewBox {
      display: none;
      position: relative;
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--card-border);
    }

    #previewImg {
      width: 100%;
      max-height: 240px;
      object-fit: contain;
      background: #000000;
      display: block;
    }

    .btn-reupload {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid var(--card-border);
      color: #FFFFFF;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      cursor: pointer;
    }

    /* 분석 중 인디케이터 */
    #ocrLoading {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      padding: 24px;
    }

    .ocr-spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(56, 189, 248, 0.2);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }

    /* 결과 편집 폼 */
    #resultFormBox {
      display: none;
      flex-direction: column;
      gap: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .form-group label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-sub);
    }

    .form-group input, .form-group textarea {
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 10px 12px;
      color: #FFFFFF;
      font-size: 13px;
      font-family: inherit;
    }

    .form-group input:focus, .form-group textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 2px rgba(56, 189, 248, 0.2);
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .action-btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .btn-save-device {
      width: 100%;
      padding: 14px;
      background: linear-gradient(135deg, #10B981 0%, #059669 100%);
      color: #FFFFFF;
      border: none;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.35);
    }

    .btn-save-sheet {
      width: 100%;
      padding: 13px;
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid var(--card-border);
      color: #E2E8F0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    /* ========================================================
       QR 모달
       ======================================================== */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      backdrop-filter: blur(8px);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .modal-content {
      background: #1E293B;
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      max-width: 340px;
      width: 100%;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
    }

    .qr-box {
      background: #FFFFFF;
      padding: 16px;
      border-radius: 16px;
      margin: 18px 0;
    }

    .btn-close-modal {
      width: 100%;
      padding: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 12px;
      color: #FFFFFF;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
    }

    /* 토스트 알림 */
    #toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--accent);
      color: #FFFFFF;
      padding: 12px 24px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      transition: transform 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28);
      z-index: 9999;
      pointer-events: none;
    }

    #toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>
<body>

  <!-- ========================================================
       7장 기관용 표준 인트로 로딩 화면
       ======================================================== -->
  <div id="introLoader">
    <img src="https://lh3.googleusercontent.com/d/18qeVrRkZh3BM0LTUcO35E-cmWcCIssJg" alt="등대의집 CI" class="loader-ci">
    <div class="loader-title">JIN HYUN . AI</div>
    <div class="loader-sub">스마트 전자명함 & AI 인맥 관리 시스템</div>
    <div class="loader-progress-track">
      <div class="loader-progress-bar" id="loaderBar"></div>
    </div>
    <div class="loader-status-msg" id="loaderMsg">프로필 및 AI 엔진 동기화 중...</div>
  </div>

  <!-- 토스트 메시지 -->
  <div id="toast"></div>

  <!-- QR 모달 -->
  <div class="modal-backdrop" id="qrModal">
    <div class="modal-content">
      <h4 style="font-size: 18px; font-weight: 800; color: #FFFFFF;">내 디지털 명함 QR</h4>
      <p style="font-size: 12px; color: var(--text-sub); margin-top: 4px;">상대방 카메라로 비추면 즉시 명함이 열립니다</p>
      <div class="qr-box" id="qrcode"></div>
      <button class="btn-close-modal" onclick="closeQrModal()">닫기</button>
    </div>
  </div>

  <div class="app-container">
    
    <!-- ========================================================
         [뷰 1] 내 디지털 전자명함 (NFC / QR 화면)
         ======================================================== -->
    <div id="viewMyCard" class="card-wrapper">
      <div class="nfc-badge">
        <i class="fa-solid fa-wifi" style="transform: rotate(90deg);"></i>
        NFC TAP & CONNECT
      </div>

      <div class="profile-avatar-box">
        <div class="profile-avatar-glow"></div>
        <img id="myAvatar" src="https://lh3.googleusercontent.com/d/18qeVrRkZh3BM0LTUcO35E-cmWcCIssJg" alt="프로필 사진" class="profile-avatar">
      </div>

      <div class="name-title-box">
        <h1 class="person-name">
          <span id="myName">장진현</span>
          <i class="fa-solid fa-circle-check" style="color: var(--accent); font-size: 18px;"></i>
        </h1>
        <div class="person-title" id="myTitle">사무국장</div>
        <div class="person-org" id="myOrg">등대의집</div>
      </div>

      <p class="person-intro" id="myIntro">
        코딩하는 사무국장 장진현입니다.
      </p>

      <!-- 핵심 액션: 상대방 폰 연락처에 저장 -->
      <button class="btn-save-contact" onclick="downloadMyVCard()">
        <i class="fa-solid fa-address-book" style="font-size: 20px;"></i>
        내 연락처 폰에 바로 저장
      </button>

      <!-- 퀵 인터랙션 4버튼 -->
      <div class="quick-actions-grid">
        <a id="btnCall" href="tel:" class="quick-btn">
          <i class="fa-solid fa-phone"></i>
          <span>전화하기</span>
        </a>
        <a id="btnSms" href="sms:" class="quick-btn">
          <i class="fa-solid fa-comment-dots"></i>
          <span>문자보내기</span>
        </a>
        <a id="btnEmail" href="mailto:" class="quick-btn">
          <i class="fa-solid fa-envelope"></i>
          <span>이메일</span>
        </a>
        <button type="button" class="quick-btn" onclick="openQrModal()">
          <i class="fa-solid fa-qrcode"></i>
          <span>QR 코드</span>
        </button>
      </div>

      <!-- 상세 프로필 리스트 -->
      <div class="contact-list">
        <div class="contact-item">
          <div class="contact-item-icon"><i class="fa-solid fa-mobile-screen"></i></div>
          <div class="contact-item-content">
            <div class="contact-item-label">휴대전화</div>
            <div class="contact-item-val" id="myMobile">-</div>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-item-icon"><i class="fa-solid fa-phone-volume"></i></div>
          <div class="contact-item-content">
            <div class="contact-item-label">직통/유선전화</div>
            <div class="contact-item-val" id="myTel">-</div>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-item-icon"><i class="fa-solid fa-at"></i></div>
          <div class="contact-item-content">
            <div class="contact-item-label">이메일</div>
            <div class="contact-item-val" id="myEmailVal">-</div>
          </div>
        </div>
        <div class="contact-item">
          <div class="contact-item-icon"><i class="fa-solid fa-location-dot"></i></div>
          <div class="contact-item-content">
            <div class="contact-item-label">주소</div>
            <div class="contact-item-val" id="myAddress">-</div>
          </div>
        </div>
        <a id="myWebsiteLink" href="#" target="_blank" class="contact-item" style="cursor: pointer;">
          <div class="contact-item-icon"><i class="fa-solid fa-globe"></i></div>
          <div class="contact-item-content">
            <div class="contact-item-label">공식 웹사이트</div>
            <div class="contact-item-val" id="myWebsiteVal" style="color: var(--accent);">-</div>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square" style="font-size: 12px; color: var(--text-muted);"></i>
        </a>
      </div>
    </div>

  </div>

  <script>
    // 전역 상태
    let myProfile = {};

    // ========================================================
    // 초기 부팅 및 로더 라이프사이클
    // ========================================================
    window.addEventListener('DOMContentLoaded', () => {
      startLoader();
      loadProfileData();
    });

    function startLoader() {
      const bar = document.getElementById('loaderBar');
      const msg = document.getElementById('loaderMsg');
      
      let progress = 10;
      bar.style.width = progress + '%';

      const interval = setInterval(() => {
        if (progress < 85) {
          progress += Math.floor(Math.random() * 15) + 5;
          bar.style.width = progress + '%';
        }
      }, 200);

      window._loaderInterval = interval;
    }

    function completeLoader() {
      clearInterval(window._loaderInterval);
      const bar = document.getElementById('loaderBar');
      const loader = document.getElementById('introLoader');
      
      bar.style.width = '100%';
      setTimeout(() => {
        loader.style.opacity = '0';
        setTimeout(() => {
          loader.style.display = 'none';
        }, 350);
      }, 300);
    }

    // ========================================================
    // 프로필 데이터 로드
    // ========================================================
    function loadProfileData() {
      google.script.run
        .withSuccessHandler((res) => {
          if (res && res.success && res.profile) {
            myProfile = res.profile;
            renderMyProfile(myProfile);
          } else {
            showToast('프로필 로드에 실패하여 기본 정보로 표시합니다.');
          }
          completeLoader();
        })
        .withFailureHandler((err) => {
          console.error(err);
          completeLoader();
        })
        .getProfileData();
    }

    function renderMyProfile(p) {
      if (p.name) document.getElementById('myName').innerText = p.name;
      if (p.title) document.getElementById('myTitle').innerText = p.title;
      if (p.organization) document.getElementById('myOrg').innerText = p.organization;
      if (p.intro) document.getElementById('myIntro').innerText = p.intro;
      
      if (p.photo_url_display) {
        document.getElementById('myAvatar').src = p.photo_url_display;
      }
      
      if (p.mobile) {
        document.getElementById('myMobile').innerText = p.mobile;
        document.getElementById('btnCall').href = 'tel:' + p.mobile;
        document.getElementById('btnSms').href = 'sms:' + p.mobile;
      }
      if (p.tel) {
        document.getElementById('myTel').innerText = p.tel;
      }
      if (p.email) {
        document.getElementById('myEmailVal').innerText = p.email;
        document.getElementById('btnEmail').href = 'mailto:' + p.email;
      }
      if (p.address) {
        document.getElementById('myAddress').innerText = p.address;
      }
      if (p.website) {
        document.getElementById('myWebsiteVal').innerText = p.website;
        document.getElementById('myWebsiteLink').href = p.website;
      }

      // 방문 로그 남기기
      google.script.run.recordVisit('WEB_LOAD', navigator.userAgent, false);
    }

    // ========================================================
    // 탭 전환 로직
    // ========================================================
    function switchTab() {}

    // ========================================================
    // vCard (.vcf) 생성 및 스마트폰 연락처 바로 저장
    // ========================================================
    function vcEsc(v) {
      return String(v || '')
        .replace(/\\/g, '\\\\')
        .replace(/\r?\n/g, '\\n')
        .replace(/,/g, '\\,')
        .replace(/;/g, '\\;');
    }

    function generateVCardString(data) {
      const full = String(data.name || '').trim();
      // 한글 이름은 첫 글자를 성, 나머지를 이름으로 나눠 연락처 앱에서 자연스럽게 보이게 함
      let family = '', given = full;
      if (/^[가-힣]{2,4}$/.test(full)) { family = full.charAt(0); given = full.slice(1); }
      const lines = ['BEGIN:VCARD', 'VERSION:3.0'];
      lines.push('N:' + vcEsc(family) + ';' + vcEsc(given) + ';;;');
      lines.push('FN:' + vcEsc(full));
      if (data.organization || data.department) lines.push('ORG:' + vcEsc(data.organization) + (data.department ? ';' + vcEsc(data.department) : ''));
      if (data.title) lines.push('TITLE:' + vcEsc(data.title));
      if (data.mobile) lines.push('TEL;TYPE=CELL:' + vcEsc(data.mobile));
      if (data.tel) lines.push('TEL;TYPE=WORK,VOICE:' + vcEsc(data.tel));
      if (data.email) lines.push('EMAIL;TYPE=INTERNET:' + vcEsc(data.email));
      if (data.address) lines.push('ADR;TYPE=WORK:;;' + vcEsc(data.address) + ';;;;');
      if (data.website) lines.push('URL:' + vcEsc(data.website));
      if (data.memo) lines.push('NOTE:' + vcEsc(data.memo));
      lines.push('END:VCARD');
      return lines.join('\r\n') + '\r\n';
    }

    function triggerVCardDownload(vcardContent, filename) {
      const blob = new Blob([vcardContent], { type: 'text/vcard' });
      const url = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.href = url;
      link.setAttribute('download', filename);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    // 내 연락처 다운로드
    function downloadMyVCard() {
      const vcard = generateVCardString({
        name: myProfile.name || '장진현',
        organization: myProfile.organization || '등대의집',
        department: '',
        title: myProfile.title || '사무국장',
        mobile: myProfile.mobile || '010-4790-1011',
        tel: myProfile.tel || '041-582-4495',
        email: myProfile.email || '2016235@light4u.kr',
        address: myProfile.address || '충청남도 천안시 서북구 직산읍 성진로410-11',
        website: myProfile.website || 'https://jinhyun.ai.kr',
        memo: myProfile.intro || '코딩하는 사무국장 장진현입니다.'
      });

      triggerVCardDownload(vcard, `${myProfile.name || '장진현'}_국장_연락처.vcf`);
      showToast('📲 연락처 파일이 열립니다. [저장]을 눌러주세요!');
      google.script.run.recordVisit('SAVE_MY_CONTACT', navigator.userAgent, true);
    }

    // ========================================================
    // QR 모달
    // ========================================================
    function openQrModal() {
      const modal = document.getElementById('qrModal');
      const qrContainer = document.getElementById('qrcode');
      qrContainer.innerHTML = '';
      
      const currentUrl = window.location.href.split('?')[0];
      new QRCode(qrContainer, {
        text: currentUrl,
        width: 180,
        height: 180,
        colorDark : "#0F172A",
        colorLight : "#FFFFFF",
        correctLevel : QRCode.CorrectLevel.H
      });

      modal.style.display = 'flex';
    }

    function closeQrModal() {
      document.getElementById('qrModal').style.display = 'none';
    }

    // ========================================================
    // 토스트 알림
    // ========================================================
    function showToast(msg) {
      const toast = document.getElementById('toast');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 3000);
    }
  </script>
</body>
</html>
